name: Upstream Metasploit release

on:
  schedule:
    # Daily at 05:17 UTC.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: upstream-metasploit-release
  cancel-in-progress: false

jobs:
  track:
    name: Track rapid7/metasploit-framework tags
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The bump branch is pushed and the pull request opened from here.
          persist-credentials: true

      - name: Open a bump PR when upstream moves
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/upstream_bump.sh

      - name: Start CI on the bump branch
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "upstream/metasploit-${{ steps.bump.outputs.upstream }}"
